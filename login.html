<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据平台登录</title>
    <link rel="stylesheet" href="login.css">
    .
    <script src="http://code.jquery.com/jquery-latest.js"></script>
</head>
<body>
<div class="box">
    <div class="pre-box">
        <h1>云构经纬</h1>
        <!--        <div class="img-box">-->
        <!--            &lt;!&ndash;<img src="./img/waoku.jpg" alt="科技图标">&ndash;&gt;-->
        <!--        </div>-->
        <div class="boxnav" id="echart4" style="height: 200px;">
            <img id="echart4-img" src="logo.png" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <h1>新能源汽车数据分析平台</h1>
    </div>

    <!-- 注册表单 -->
    <div class="register-form">
        <div class="title-box">
            <h1>用户注册</h1>
        </div>
        <div class="input-box">
            <input type="text" placeholder="请输入用户名">
            <input type="password" placeholder="请输入密码">
            <input type="password" placeholder="确认密码">
        </div>
        <div class="btn-box">
            <button id="registerBtn">立即注册</button>
            <p onclick="mySwitch()">已有账号</p>
        </div>
    </div>

    <!-- 登录表单 -->
    <div class="login-form">
        <div class="title-box">
            <h1>用户登录</h1>
        </div>
        <div class="input-box">
            <input type="text" placeholder="请输入用户名">
            <input type="password" placeholder="请输入密码">
        </div>
        <div class="btn-box">
            <button>
                <a href="./index.html">立即登录</a>
            </button>
            <p onclick="mySwitch()">注册账号</p>
        </div>
    </div>
</div>

<script>
    let flag = true;
    const mySwitch = () => {
        const preBox = $(".pre-box");
        if (flag) {
            preBox.css("transform", "translateX(100%)");
            preBox.css("background", "#00d4ff");  // 修改alpha值为1
        } else {
            preBox.css("transform", "translateX(0%)");
            preBox.css("background", "rgba(24, 72, 180, 1)"); // 修改alpha值为1
        }
        flag = !flag;
    }

    // 注册按钮点击事件
    document.getElementById("registerBtn").addEventListener("click", function (e) {
        e.preventDefault();
        alert("注册成功");
    });
</script>
</body>
</html>
